services:
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.5
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    image: sail-8.5/laravel-queue-monitor
    command: ['sleep', 'infinity']   # a package, not an app: keep the container idle
    extra_hosts: ['host.docker.internal:host-gateway']
#    ports:
#      - '${APP_PORT:-80}:8000'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.queue-monitor.rule=Host(`queue-monitor.app.localhost`)"
      - "traefik.http.routers.queue-monitor.entrypoints=websecure"
      - "traefik.http.routers.queue-monitor.tls=true"
      - "traefik.http.routers.queue-monitor.service=queue-monitor"
      - "traefik.http.services.queue-monitor.loadbalancer.server.port=8000"
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
    volumes:
      - '.:/var/www/html'
    networks: [sail,proxy]
    depends_on: [pgsql, redis]

  pgsql:
    image: 'postgres:18-alpine'
    ports: ['${FORWARD_DB_PORT:-5433}:5432']
    environment:
      # `sail psql` reads PGPASSWORD from inside this container.
      PGPASSWORD: 'password'
      POSTGRES_DB: 'testing'
      POSTGRES_USER: 'sail'
      POSTGRES_PASSWORD: 'password'
    volumes: ['sail-pgsql:/var/lib/postgresql']
    networks: [sail]

  redis:
    image: 'redis:8-alpine'
    ports: ['${FORWARD_REDIS_PORT:-6380}:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['sail-redis:/data']
    networks: [sail]

networks: { sail: { driver: bridge } ,proxy: { external: true} }
volumes: { sail-pgsql: { driver: local }, sail-redis: { driver: local } }
